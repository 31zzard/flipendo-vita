# TURBO: the lowest quality, the highest speed. Copy this file to ux0:data/flipendo/render.cfg
# (lines "name=value"; if something looks wrong, change that line back to what render.cfg has)

# --- the level: no lighting at all. The surfaces are the plain textures (bright, flat): nothing is built, uploaded or drawn for light,
# which was the biggest single part of drawing a level. 1 = as the game does
lightmap=0
macro=0
fog=0
lightmap_scale=2
exposure=100
flip_y=1
# --- textures: a quarter of the size (the HUD and fonts are not affected), 16 bit
texture16=1
texture_lod=2
texture_budget_mb=64
free_lightmap_data=1
# water and other moving textures change 8 times a second
texture_fps=8

# --- what is drawn
# particles (sparks, glow) in percent
particles=30
# meshes (people, objects) farther than this many units are not drawn at all
mesh_distance=3500
# the visibility walk's virtual screen: in percent of 2048x1080 (smaller = faster, but thin walls can leak)
clipper_scale=18
# 1 = the clipper draws each level surface as one polygon (fewer, longer spans: faster); 0 = as triangles, as before
clipper_polygons=1
world=1
meshes=1
# 1 = the game's own surface batching: plain surfaces are drawn together (far fewer draw calls)
surface_batching=1
atlas_pages=8
# 1 = a changed lightmap is written straight into the atlas; 0 = through glTexSubImage2D, which in vitaGL copies the whole
# 512x512 page (1 MB) for every lightmap: very slow when torches flicker. Change only if lightmaps look wrong
atlas_direct=1
# --- light maps (1 = on; 0 only to compare, the picture is the same either way)
# torches whose light map does not change (HP1 leaves their flicker out) are not built again every frame
still_lights=1
# a flickering light adds itself to the kept sum of the surface's other lights, instead of all its lights being added again
lightmap_incremental=1
# a surface looks for dynamic lights only among the level's dynamic lights, not among all of its lights
dynamic_light_list=1
# lap timers (the log's 'laps' and 'ticks by class' lines): they time one frame in 8, which costs about 1 ms a frame. 0 = off
probes=1
# --- sound
# 1 = MP2/MP3 sounds (dialogue, ambience) are decoded on another core; the sound starts a few frames later instead of the
# game stopping for 30-230 ms the first time it plays. 0 = decoded in the frame, as before
sound_thread=1
# lights that flicker change their lightmaps every 8th frame (nothing to do when lightmap=0)
light_anim_divider=8

# --- the game's own work
# actors that are not in view and are farther than 1500 units are ticked every 4th frame; the ones in view only beyond 2500 units
tick_far_distance=1500
tick_far_rate=4
tick_far_visible=2500
bspinfo_cache=1
# rays that ask "is something in the way?" are answered from memory (0.12 s) and only look at doors
trace_cache=1
mover_trace=1
# the skinned vertices and the light of a mesh are kept for 3 frames when it is far away and has not moved
skin_cache=1
skin_cache_age=3
# at most 2 lights per mesh
mesh_light_max=2
# 1 = the light of a mesh's vertices is worked out four at a time, and its faces go to the renderer in runs: faster. 0 = as before
mesh_fast=1
# 2 = the visible meshes are posed, skinned and lit before drawing, the arithmetic on the Vita's other two cores; 1 = the same on
# one core (to compare); 0 = each mesh while it is drawn, as before
mesh_threads=2
# 1 = the bones of those meshes are animated on the other cores too (not a mesh with aux animation channels); 0 = on the main thread
anim_threads=1
# with mesh_lod=1 the meshes are thinned as HP1 does it: by their size on screen, and more while the frame rate is under lod_min_fps
mesh_lod=1
lod_min_fps=30

# --- the system
engine_priority=96
# 0 = actors that are bStatic (lights, most decorations) are not ticked, as in the original game; 1 = every actor every frame
tick_static=0
flush_to_zero=1
gc=0
# no timing of the engine's parts (saves a system call per mesh, surface...): the log then shows no 'engine parts' figures
section_timers=0
slow_frame_ms=250
# do not wait for the screen's refresh: frames are not rounded up to 16.7 ms steps. Tearing is possible: 1 if it bothers you
vsync=0

# 1 = the OpenGL calls and presenting the picture are made on a thread of their own, while the engine already makes the next frame
# (scripts, physics, the next picture). 0 = on the engine's thread, as before (if the picture breaks up or the game hangs: 0)
gl_thread=1
# the core of that thread (0, 1, 2; -1 = any) and its priority (smaller = more urgent; the engine is at engine_priority)
gl_thread_core=2
gl_thread_priority=100
# 1 = the level's plain surfaces keep their vertices in video memory: a surface drawn again costs only its indices. 0 = made every
# frame, as before (if level walls flicker, are missing or show wrong textures: 0)
surface_cache=1
# at most this many vertex buffers of 1.75 MB (65536 vertices) for it
surface_chunks=6
# the visibility walk (what is hidden behind what): 1 = on the three cores, each looking at a part of the screen; 0 = on one core;
# 2 = auto: both are timed where you are every half a minute or so and the faster is used (the trial frames stutter)
parallel_vis=0
# 1 = a surface's light map is not looked at again when none of its lights changed. 0 = every frame, as before
lightmap_skip=1
# --- texture loading
mipmaps=0
upload_budget_ms=4
texture_inplace=1
heartbeat=0
# Spell lessons (VitaSpellLesson.cpp). spell_touch=1: draw the spell with a finger on the front screen (finger down = drawing,
# lift it = done). spell_assist=1: with the cast button held, either stick moves the wand along the template's line (0 = draw
# freely as on the PC). spell_speed: full stick goes over the whole shape in this percent of the lesson's time. spell_time: the
# lesson's time in percent (100 = the original's)
spell_touch=1
spell_assist=1
spell_speed=60
spell_time=100
# actor shadows: the script places a still character's shadow again only every (shadow_skip + 1)-th frame; one that moves, every
# frame. 0 = every shadow every frame, as before
shadow_skip=3
