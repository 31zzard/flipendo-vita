# Settings of the Vita renderer: copy this file to ux0:data/flipendo/render.cfg (lines "name=value", # is a comment)
# lightmap_scale: 2 is what the original does, 1 is darker
lightmap_scale=2
lightmap=1
macro=1
fog=1
# brightness of the textures in percent, 10..100: lower it if everything is too bright
exposure=100
# 16 bit textures (half the memory); 0 = 32 bit, if colours look wrong
texture16=1
texture_budget_mb=64
# particles (sparks of spells) in percent of what the game wants: fewer = faster
particles=60
# 0 hides the level surfaces / the meshes (characters, objects): to see what costs the time
world=1
meshes=1
flip_y=1
# the engine's garbage collector at a map change: it frees objects that are still in use and crashes at the start. Leave it 0
gc=0
# the floating point unit treats numbers too small to be normal as zero (faster); 0 = off
flush_to_zero=1
# the level's textures are drawn from a smaller mip level: 0 = full size, 1 = half width and height (less GPU memory
# and bandwidth), 2 = a quarter. The HUD and fonts are not affected
texture_lod=1
# the engine's float copy of a lightmap is freed once it is on the GPU: saves heap
free_lightmap_data=1
# meshes (characters, objects) farther from the camera than this many units are not drawn at all. 0 = draw all
mesh_distance=0
# the visibility clipper's virtual screen in percent of 2048x1080: 50 = 1024x540. Lower = faster 'process' step, 100 = original
clipper_scale=18
# 1 = the clipper draws each level surface as one polygon (fewer, longer spans: faster); 0 = as triangles, as before
clipper_polygons=1
# priority of the engine thread: 64 is the highest. The sound thread has 64 too, so with 96 it can interrupt the engine
# when it needs to (less crackling in heavy scenes). Higher number = lower priority (up to 191)
engine_priority=96
# 0 = actors that are bStatic (lights, most decorations) are not ticked, as in the original game; 1 = every actor every frame
tick_static=0
# a frame longer than this many milliseconds is written to the log with where its time went (SLOW FRAME lines)
slow_frame_ms=150
# 1 times every draw call of the renderer (the 'device' figure in the log). A system call each: it slows polygons down, so it is off
device_timing=0
# animated lights (torches) change their lightmaps only every n-th frame: 1 = every frame (the original)
light_anim_divider=3
# rays that ignore actors (is a wall in the way? used by aiming, AI, coronas): answered from memory for 0.12 s / only look at movers
trace_cache=1
mover_trace=1
# plain level surfaces are drawn together (by texture, with all lightmaps in a few big textures): far fewer draw calls.
# 0 = each surface alone, as before (if the lighting ever looks wrong)
surface_batching=1
# how many 512x512 lightmap textures there may be (8 = 8 MB of video memory)
atlas_pages=8
# 1 = a changed lightmap is written straight into the atlas; 0 = through glTexSubImage2D, which in vitaGL copies the whole
# 512x512 page (1 MB) for every lightmap: very slow when torches flicker. Change only if lightmaps look wrong
atlas_direct=1
# --- light maps (1 = on; 0 only to compare, the picture is the same either way)
# torches whose light map does not change (HP1 leaves their flicker out) are not built again every frame
still_lights=1
# a flickering light adds itself to the kept sum of the surface's other lights, instead of all its lights being added again
lightmap_incremental=1
# a surface looks for dynamic lights only among the level's dynamic lights, not among all of its lights
dynamic_light_list=1
# lap timers (the log's 'laps' and 'ticks by class' lines): they time one frame in 8, which costs about 1 ms a frame. 0 = off
probes=0
# --- sound
# 1 = MP2/MP3 sounds (dialogue, ambience) are decoded on another core; the sound starts a few frames later instead of the
# game stopping for 30-230 ms the first time it plays. 0 = decoded in the frame, as before
sound_thread=1
# an actor in view that is farther than this many units (and not the player's) is ticked every tick_far_rate-th frame as well; 0 = off
tick_far_visible=0
# the skinned vertices and the light of a mesh are kept: for the second pass of a frame, and (a mesh farther than 1500 units that has
# not moved) for skin_cache_age frames. 0 = off
skin_cache=1
skin_cache_age=2
# at most this many lights per mesh (the game uses up to 3-5; 2 is visibly flatter but much cheaper). 16 = as the game does
mesh_light_max=16
# 1 = the light of a mesh's vertices is worked out four at a time, and its faces go to the renderer in runs: faster. 0 = as before
mesh_fast=1
# 2 = the visible meshes are posed, skinned and lit before drawing, the arithmetic on the Vita's other two cores; 1 = the same on
# one core (to compare); 0 = each mesh while it is drawn, as before
mesh_threads=2
# 1 = the bones of those meshes are animated on the other cores too (not a mesh with aux animation channels); 0 = on the main thread
anim_threads=1
# with mesh_lod=1 the meshes are thinned as HP1 does it: by their size on screen, and more while the frame rate is under lod_min_fps
mesh_lod=1
lod_min_fps=30
# 0 turns off the timing of the engine's parts (the 'engine parts' and SLOW FRAME figures in the log): a little faster
section_timers=0
# 0 = do not wait for the screen's refresh: frames are not rounded up to 16.7 ms steps, but there can be tearing
vsync=1
# Frame rate cap, 30 or 60 only. 60 = up to 60 fps (frames of 16.7 or 33.3 ms as they come); 30 = an even 30 fps in the game
# (a frame stays two refreshes on the screen; the menus keep 60)
fps_lock=60
# 1 = the OpenGL calls and presenting the picture are made on a thread of their own, while the engine already makes the next frame
# (scripts, physics, the next picture). 0 = on the engine's thread, as before (if the picture breaks up or the game hangs: 0)
gl_thread=1
# the core of that thread (0, 1, 2; -1 = any) and its priority (smaller = more urgent; the engine is at engine_priority)
gl_thread_core=2
gl_thread_priority=100
# 1 = the level's plain surfaces keep their vertices in video memory: a surface drawn again costs only its indices. 0 = made every
# frame, as before (if level walls flicker, are missing or show wrong textures: 0)
surface_cache=1
# at most this many vertex buffers of 1.75 MB (65536 vertices) for it
surface_chunks=6
# the visibility walk (what is hidden behind what): 1 = on the three cores, each looking at a part of the screen; 0 = on one core;
# 2 = auto: both are timed where you are every half a minute or so and the faster is used (the trial frames stutter)
parallel_vis=0
# 1 = a surface's light map is not looked at again when none of its lights changed. 0 = every frame, as before
lightmap_skip=1
# --- texture loading
# 0 = one picture per texture; 2 = the texture's own smaller pictures are uploaded too (less shimmering far away, a third more video
# memory; level and mesh textures only); 1 = the GPU makes the smaller pictures itself. If textures look wrong (black, wrong colours): 0
mipmaps=0
# a frame that has spent this many milliseconds uploading textures draws the next new ones from a coarse picture (an eighth of the size)
# and sharpens them in later frames: no long frame when many textures appear at once. 0 = off
upload_budget_ms=6
# a texture that changes (water, fire) is changed in place, not made again. 0 = made again every time
texture_inplace=1
# 1 shows the small flashing square in the top left corner (proof that frames are drawn)
heartbeat=0
# Spell lessons (VitaSpellLesson.cpp). spell_touch=1: draw the spell with a finger on the front screen (finger down = drawing,
# lift it = done). spell_assist=1: with the cast button held, either stick moves the wand along the template's line (0 = draw
# freely as on the PC). spell_speed: full stick goes over the whole shape in this percent of the lesson's time. spell_time: the
# lesson's time in percent (100 = the original's)
spell_touch=1
spell_assist=1
spell_speed=60
spell_time=100
# actor shadows: the script places a still character's shadow again only every (shadow_skip + 1)-th frame; one that moves, every
# frame. 0 = every shadow every frame, as before
shadow_skip=3
# The frame counter in the top left corner: 0 = off (default), 1 = frames per second, 2 = also where the time goes.
# With 1 or 2 a tap with two fingers on the rear touch pad switches it (off -> FPS -> full -> off); with 0 it can't be switched on
fps_counter=0
water_fps=10
fog_rate=3
# Camera speed of the right stick, percent (25..400; 100 = ~57 / 95 / 190 degrees a second at full tilt with the options
# page's Mouse Sensitivity 3 / 5 / 10). The sensitivity slider is the main control; this scales all of it.
camera_speed=100
# Front touch in the title and pause menus (the finger is the mouse, touching = left button). 0 = off
menu_touch=1
# HP1's debug mode: 1 = on (the title menu gets Level Select, Language, Credits and the version; 'Debug' top left), 0 = off
debug_mode=0
